<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Interactive card details form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-screen w-screen overflow-hidden">
    <div class="flex h-full w-full">
      <div
        class="h-full w-[35%] bg-[url('images/bg-main-desktop.png')] bg-cover bg-no-repeat relative"
      >
        <div
          class="absolute left-[20%] top-[20%] w-[447px] h-[245px] bg-[url('images/bg-card-front.png')] bg-contain bg-no-repeat p-8 text-white"
        >
          <img src="images/card-logo.svg" alt="" />
          <div class="mt-20 text-2xl tracking-widest">0000 0000 0000 0000</div>
          <div class="flex justify-between mt-8 uppercase text-sm">
            <span>Jane Appleseed</span>
            <span>00/00</span>
          </div>
        </div>

        <div
          class="absolute left-[30%] top-[55%] w-[447px] h-[245px] bg-[url('images/bg-card-back.png')] bg-contain bg-no-repeat"
        >
          <span class="absolute right-12 top-[110px] text-white text-sm"
            >000</span
          >
        </div>
      </div>
      <div class="h-full w-[65%] flex justify-center items-center">
        <form
          class="w-[380px] flex flex-col gap-6 uppercase tracking-widest text-[12px] font-bold text-violet-950"
        >
          <div class="flex flex-col gap-2">
            <label>Cardholder Name</label>
            <input
              type="text"
              placeholder="e.g. Jane Appleseed"
              class="border border-gray-300 rounded-lg p-3 outline-none focus:border-violet-500 transition-all font-medium"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label>Card Number</label>
            <input
              type="text"
              placeholder="e.g. 1234 5678 9123 0000"
              class="border border-gray-300 rounded-lg p-3 outline-none focus:border-violet-500 transition-all font-medium"
            />
          </div>

          <div class="flex gap-4">
            <div class="w-1/2 flex flex-col gap-2">
              <label>Exp. Date (MM/YY)</label>
              <div class="flex gap-2">
                <input
                  type="text"
                  placeholder="MM"
                  class="w-1/2 border border-gray-300 rounded-lg p-3 outline-none focus:border-violet-500 transition-all"
                />
                <input
                  type="text"
                  placeholder="YY"
                  class="w-1/2 border border-gray-300 rounded-lg p-3 outline-none focus:border-violet-500 transition-all"
                />
              </div>
            </div>
            <div class="w-1/2 flex flex-col gap-2">
              <label>CVC</label>
              <input
                type="text"
                placeholder="e.g. 123"
                class="border border-gray-300 rounded-lg p-3 outline-none focus:border-violet-500 transition-all"
              />
            </div>
          </div>

          <button
            type="submit"
            class="bg-violet-950 text-white py-4 rounded-lg mt-4 hover:bg-violet-900 transition-all cursor-pointer"
          >
            Confirm
          </button>
        </form>
        <script>
          const cardName = document.querySelector(".card-name-display");
          const cardNumber = document.querySelector(".card-number-display");
          const cardMonth = document.querySelector(".card-month-display");
          const cardYear = document.querySelector(".card-year-display");
          const cardCvc = document.querySelector(".card-cvc-display");

          const inputName = document.querySelector(".name-input");
          const inputNumber = document.querySelector(".number-input");
          const inputMonth = document.querySelector(".month-input");
          const inputYear = document.querySelector(".year-input");
          const inputCvc = document.querySelector(".cvc-input");

          inputName.addEventListener("input", (e) => {
            cardName.textContent = e.target.value || "Jane Appleseed";
          });

          inputNumber.addEventListener("input", (e) => {
            let value = e.target.value
              .replace(/\s+/g, "")
              .replace(/[^0-9]/g, "");
            let formattedValue = value.match(/.{1,4}/g)?.join(" ") || "";

            e.target.value = formattedValue;
            cardNumber.textContent = formattedValue || "0000 0000 0000 0000";
          });

          inputMonth.addEventListener("input", (e) => {
            let val = e.target.value.replace(/[^0-9]/g, "");
            e.target.value = val;
            cardMonth.textContent = val.padStart(2, "0").slice(0, 2) || "00";
          });

          inputYear.addEventListener("input", (e) => {
            let val = e.target.value.replace(/[^0-9]/g, "");
            e.target.value = val;
            cardYear.textContent = val.padStart(2, "0").slice(0, 2) || "00";
          });

          inputCvc.addEventListener("input", (e) => {
            let val = e.target.value.replace(/[^0-9]/g, "");
            e.target.value = val;
            cardCvc.textContent = val || "000";
          });

          document.querySelector("form").addEventListener("submit", (e) => {
            e.preventDefault();
            alert("Card details added successfully!");
          });
        </script>
      </div>
    </div>
    <!-- 0000 0000 0000 0000
  Jane Appleseed
  00/00

  000

  Cardholder Name
  e.g. Jane Appleseed

  Card Number
  e.g. 1234 5678 9123 0000

  Exp. Date (MM/YY)
  MM
  YY

  CVC
  e.g. 123

  Confirm

  Thank you!
  We've added your card details
  Continue -->
  </body>
</html>
